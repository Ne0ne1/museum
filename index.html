<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Портал времени ЧР</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section class="screen active intro-screen">
      <div class="intro-content">
        <h1>Портал времени ЧР</h1>
        <p class="subtitle">Музей новых технологий · история мест Чеченской Республики</p>
        <div class="gesture-hints">
          <div class="hint">
            <span class="hint-icon">🖐️</span>
            <span>Короткий свайп открытой ладонью ←→↑↓ — соседняя точка</span>
          </div>
          <div class="hint">
            <span class="hint-icon">🤏</span>
            <span>Сведи пальцы на миг — открыть</span>
          </div>
          <div class="hint">
            <span class="hint-icon">☝️</span>
            <span>Задержи палец на событии — подробности</span>
          </div>
          <div class="hint">
            <span class="hint-icon">✊</span>
            <span>Сожми кулак на миг — назад</span>
          </div>
          <div class="hint">
            <span class="hint-icon">🙌</span>
            <span>Две руки: разведи — приблизь карту, сведи — отдали</span>
          </div>
        </div>
        <a href="map.html" class="btn-primary" id="start-btn">Начать</a>
      </div>
    </section>
  </div>
</body>
</html>
