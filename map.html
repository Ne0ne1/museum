<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Карта ЧР — Портал времени</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=10" />
  <link rel="stylesheet" href="css/portal.css?v=5" />
</head>
<body>
  <div id="app">
    <section class="screen active map-screen">
      <header class="mode-header">
        <div>
          <h2>Карта Чеченской Республики</h2>
          <p class="mode-hint" id="map-focus-hint">Сначала район · pinch — приблизить · потом место · кулак — назад</p>
        </div>
        <a href="index.html" class="mode-switch-btn">← На старт</a>
      </header>

      <div class="map-layout">
        <div id="gallery-canvas" class="gallery-canvas"></div>
        <aside class="place-sidebar">
          <h3 id="place-list-title">Районы</h3>
          <div id="place-list" class="place-list"></div>
        </aside>
      </div>
    </section>

    <!-- Lucy-style portal: full-bleed photo + year rail (NOT cards) -->
    <div class="portal" id="place-portal" aria-label="Портал времени места">
      <div class="hero is-front" data-hero="a"></div>
      <div class="hero is-back" data-hero="b"></div>
      <div class="veil"></div>
      <div class="status" data-status>Загрузка…</div>
      <header class="top">
        <button type="button" class="back-link" data-back>← К карте · кулак 2 сек</button>
      </header>
      <button type="button" class="nav prev" data-prev aria-label="Предыдущий год">‹</button>
      <button type="button" class="nav next" data-next aria-label="Следующий год">›</button>
      <footer class="rail">
        <div class="rail-track">
          <div class="rail-line"></div>
          <div class="rail-years" data-rail></div>
        </div>
        <p class="hint">Взмах ладонью ←→ · держи кулак 2 сек — назад</p>
      </footer>
    </div>

    <video id="input-video" playsinline muted autoplay></video>
    <canvas id="debug-canvas" width="640" height="480"></canvas>
    <div id="hand-cursor" class="hand-cursor hidden"></div>
    <div id="camera-status" class="camera-status">Загрузка…</div>
  </div>

  <script>
    document.getElementById('camera-status').textContent = 'HTML готов…';
    window.addEventListener('error', function (e) {
      var el = document.getElementById('camera-status');
      if (el) el.textContent = 'Ошибка: ' + e.message;
    });
  </script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/pages/map.js?v=8"></script>
</body>
</html>
